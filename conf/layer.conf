# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "renovatio"
BBFILE_PATTERN_renovatio = "^${LAYERDIR}/"
BBFILE_PRIORITY_renovatio = "10"

LAYERDEPENDS_renovatio = "core raspberrypi openembedded-layer networking-layer"
LAYERSERIES_COMPAT_renovatio = "scarthgap"
